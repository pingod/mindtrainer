    <style>
        /* ===== Page-specific full-screen gallery ===== */
        *, *::before, *::after { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; overflow: hidden; }
        body {
            background: var(--dark-bg);
            color: var(--dark-ink);
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== Mesh gradient background ===== */
        .gallery-bg {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background:
                radial-gradient(900px 600px at 15% 15%, rgba(59,130,246,.12), transparent 55%),
                radial-gradient(700px 500px at 90% 85%, rgba(139,92,246,.08), transparent 55%);
        }
        .gallery-bg::after {
            content: ""; position: absolute; inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
            background-size: 48px 48px;
            -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, #000 20%, transparent 85%);
            mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, #000 20%, transparent 85%);
        }

        /* ===== Top bar ===== */
        .gallery-topbar {
            position: relative; z-index: 10;
            display: flex; align-items: center; gap: 16px;
            padding: 0 24px; height: 56px;
            background: rgba(15,20,36,.7);
            -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,.07);
        }
        .gallery-back {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 14px; font-weight: 600; color: var(--dark-ink-2);
            text-decoration: none; transition: color .2s ease;
        }
        .gallery-back:hover { color: #fff; }
        .gallery-back svg { width: 16px; height: 16px; }
        .gallery-title {
            font-size: 16px; font-weight: 800; letter-spacing: -.02em; color: #fff;
        }
        .gallery-count {
            margin-left: auto;
            font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
            color: var(--dark-ink-3);
            background: rgba(255,255,255,.05);
            padding: 5px 12px; border-radius: var(--r-pill);
            border: 1px solid rgba(255,255,255,.08);
        }
        .gallery-random {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 13px; font-weight: 600; cursor: pointer;
            background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.12);
            color: var(--dark-ink);
            padding: 6px 14px; border-radius: var(--r-pill);
            transition: background .2s ease, border-color .2s ease;
        }
        .gallery-random:hover { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.2); }
        .gallery-random svg { width: 14px; height: 14px; }

        /* ===== Layout ===== */
        .gallery-body {
            position: relative; z-index: 1;
            display: flex;
            height: calc(100vh - 56px);
            height: calc(100dvh - 56px);
        }

        /* ===== Sidebar ===== */
        .gallery-sidebar {
            width: 260px; flex: none;
            background: rgba(15,20,36,.5);
            -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
            border-right: 1px solid rgba(255,255,255,.07);
            display: flex; flex-direction: column;
            overflow: hidden;
        }
        .sidebar-search {
            padding: 14px 14px 10px;
            position: relative;
        }
        .sidebar-search input {
            width: 100%; box-sizing: border-box;
            background: rgba(255,255,255,.05);
            border: 1px solid rgba(255,255,255,.1);
            border-radius: var(--r-sm);
            color: var(--dark-ink);
            font: inherit; font-size: 13px;
            padding: 9px 12px 9px 34px;
            outline: none;
            transition: border-color .2s ease, background .2s ease;
        }
        .sidebar-search input::placeholder { color: var(--dark-ink-3); }
        .sidebar-search input:focus {
            border-color: rgba(59,130,246,.4);
            background: rgba(255,255,255,.07);
        }
        .sidebar-search svg {
            position: absolute; left: 26px; top: 50%; transform: translateY(-50%);
            width: 15px; height: 15px; color: var(--dark-ink-3);
            pointer-events: none;
        }
        .sidebar-nav {
            flex: 1; overflow-y: auto;
            padding: 4px 10px 16px;
        }
        .sidebar-nav::-webkit-scrollbar { width: 5px; }
        .sidebar-nav::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 3px; }
        .sidebar-cat {
            font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
            color: var(--dark-ink-3);
            padding: 16px 10px 6px;
            position: sticky; top: 0;
            background: rgba(15,20,36,.8);
            -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
            z-index: 1;
        }
        .comp-btn {
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
            width: 100%; text-align: left;
            background: none; border: none;
            color: rgba(255,255,255,.6);
            padding: 8px 12px; border-radius: var(--r-sm);
            cursor: pointer; font: inherit; font-size: 13px;
            transition: background .15s ease, color .15s ease;
        }
        .comp-btn:hover { background: rgba(255,255,255,.05); color: #fff; }
        .comp-btn.active {
            background: linear-gradient(135deg, rgba(59,130,246,.2), rgba(139,92,246,.12));

            border: 1px solid rgba(59,130,246,.2);

        }
        .comp-btn small {
            font-size: 10.5px; color: rgba(255,255,255,.3);
            flex-shrink: 0;
        }
        .comp-btn.active small { color: rgba(255,255,255,.45); }

        /* ===== Demo stage ===== */
        .gallery-stage {
            flex: 1; display: flex; flex-direction: column;
            min-width: 0; padding: 16px;
        }
        .stage-canvas-wrap {
            position: relative; flex: 1;
            border-radius: var(--r-card);
            overflow: hidden;
            background: #0a0e1a;
            border: 1px solid rgba(255,255,255,.08);
            box-shadow: 0 30px 80px -30px rgba(0,0,0,.5);
        }
        #source-canvas {
            position: absolute; inset: 0; width: 100%; height: 100%;
            opacity: 0; pointer-events: none;
        }
        #content {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: clamp(28px, 5.5vw, 72px);
            font-weight: 800; letter-spacing: .04em;
            color: #fff; text-align: center; line-height: 1.15;
            pointer-events: none;
        }
        #output-canvas {
            position: absolute; inset: 0; width: 100%; height: 100%;
        }

        /* Stage overlay badges */
        .stage-hint {
            position: absolute; top: 14px; left: 14px;
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 11px; font-weight: 600; letter-spacing: .06em;
            color: rgba(255,255,255,.4);
            background: rgba(0,0,0,.3);
            -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
            padding: 5px 12px; border-radius: var(--r-pill);
            border: 1px solid rgba(255,255,255,.06);
            z-index: 5; pointer-events: none;
            opacity: 0; transition: opacity .3s ease;
        }
        .stage-hint.show { opacity: 1; }

        /* Info bar */
        .stage-info {
            display: flex; align-items: center; gap: 14px;
            padding: 14px 4px 0;
        }
        .info-left { display: flex; align-items: baseline; gap: 12px; flex: 1; min-width: 0; }
        .info-left h3 {
            font-size: 16px; font-weight: 700; color: #fff;
            margin: 0; white-space: nowrap;
        }
        .info-left p {
            font-size: 13px; color: var(--dark-ink-2);
            margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .info-err { color: #f87171; font-size: 12.5px; flex-shrink: 0; }

        /* ===== Responsive ===== */
        @media (max-width: 768px) {
            .gallery-sidebar { width: 200px; }
            .gallery-stage { padding: 10px; }
            .gallery-topbar { padding: 0 14px; }
            .gallery-count { display: none; }
        }
        @media (max-width: 580px) {
            .gallery-body { flex-direction: column; }
            .gallery-sidebar {
                width: 100%; height: 180px;
                border-right: none;
                border-bottom: 1px solid rgba(255,255,255,.07);
            }
            .sidebar-nav { display: flex; gap: 6px; padding: 10px; overflow-x: auto; overflow-y: hidden; }
            .sidebar-cat { display: none; }
            .comp-btn { width: auto; flex-shrink: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition-duration: .01ms !important; }
        }
    </style>

    <script type="module">
        /* ============================================================
         * CanvasUI Gallery — Bug-fixed + taste-skill redesigned
         * Bugs fixed:
         *   1. Model path: box.glb → Box.glb (case-sensitive)
         *   2. Per-component options (no generic radius:0.4 breaking particle-reveal)
         *   3. Pass #content div as content element (not stage, fixes retrodither)
         *   4. Fresh output canvas per component (prevents WebGL state leakage)
         *   5. Proper source canvas drawing for dark theme
         * ============================================================ */

        const COMPONENTS = [
            // [file, createFnName, displayName, description, category]
            ['particle-reveal',    'ParticleReveal',  'ParticleReveal',  '粒子揭示：光标消散显现文字',     'reveal'],
            ['decryptreveal',      'DecryptReveal',   'DecryptReveal',   '解密揭示：字符解密显现',         'reveal'],
            ['shatter',            'Shatter',         'Shatter',         '破碎：碎块迸裂',                'reveal'],
            ['peel',               'Peel',            'Peel',            '剥离：页面剥离',                'reveal'],

            ['liquid',             'Liquid',          'Liquid',          '液体流动：流体扭曲内容',         'distort'],
            ['bend',               'Bend',            'Bend',            '弯曲：内容扭曲弯折',             'distort'],
            ['displacement',       'Displacement',    'Displacement',    '置换：位移扭曲',                'distort'],
            ['ripple',             'Ripple',          'Ripple',          '波纹：涟漪扩散',                'distort'],
            ['magnify',            'Magnify',         'Magnify',         '放大镜：局部放大',              'distort'],
            ['glitch',             'Glitch',          'Glitch',          '故障：信号失真',                'distort'],
            ['vhs',                'VHS',             'VHS',             '复古录像：VHS 特效',            'distort'],
            ['retrodither',        'RetroDither',     'RetroDither',     '复古抖动：像素噪点',             'distort'],
            ['frost',              'Frost',           'Frost',           '磨砂：霜冻玻璃',                'distort'],

            ['blaze',              'Blaze',           'Blaze',           '火焰：燃烧效果',                'atmosphere'],
            ['flamewrap',          'FlameWrap',       'FlameWrap',       '火焰包裹：火焰环绕',             'atmosphere'],
            ['clouds',             'Clouds',          'Clouds',          '云：流动云层',                  'atmosphere'],
            ['droplets',           'Droplets',        'Droplets',        '水滴：雨水滴落',                'atmosphere'],
            ['forcefield',         'ForceField',      'ForceField',      '力场：能量场波动',              'atmosphere'],
            ['bubble',             'Bubble',          'Bubble',          '气泡：漂浮气泡',                'atmosphere'],
            ['cloth',              'Cloth',           'Cloth',           '布料：织物飘动',                'atmosphere'],

            ['grid',               'Grid',            'Grid',            '网格：动态网格场',              'grid'],
            ['hexfloat',           'HexFloat',        'HexFloat',        '六边形漂浮：悬浮六边形',          'grid'],
            ['glyphrain',          'GlyphRain',       'GlyphRain',       '字符雨：数字雨下落',             'grid'],
            ['particlescroll',     'ParticleScroll',  'ParticleScroll',  '滚动粒子：滚动粒子背景',          'grid'],

            ['asciiobject',        'AsciiObject',     'AsciiObject',     'ASCII 物体：字符构成 3D 模型',   'object3d'],
            ['ditheredobject',     'DitheredObject',  'DitheredObject',  '抖动点阵：像素化模型',           'object3d'],
            ['glassobject',        'GlassObject',     'GlassObject',     '玻璃物体：玻璃质感模型',          'object3d'],
            ['liquidobject',       'LiquidObject',    'LiquidObject',    '液体物体：流体包裹模型',          'object3d'],
            ['particleobject',     'ParticleObject',  'ParticleObject',  '粒子物体：粒子构成模型',          'object3d'],

            ['glass',              'Glass',           'Glass',           '玻璃：毛玻璃折射',              'material'],
            ['laser',              'Laser',           'Laser',           '激光：激光光束',                'material'],
            ['canvas',             'Canvas',          'Canvas',          '画布：基础画布',                'material'],
            ['asciify',            'Asciify',         'Asciify',         'ASCII 滤镜：画面字符化',         'material'],
        ];

        const CATEGORY_LABELS = {
            reveal:      '揭示 / 破碎',
            distort:     '扭曲 / 变形',
            atmosphere:  '氛围 / 天气',
            grid:        '网格 / 粒子',
            object3d:    '3D 物体',
            material:    '材质 / 光效',
        };

        // Object-type components (Three.js + GLTF)
        const OBJECT_COMPONENTS = new Set(['asciiobject', 'ditheredobject', 'glassobject', 'liquidobject', 'particleobject']);
        // FIX: correct case — file is Box.glb not box.glb
        const MODEL_URL = '/vendor/canvasui-three/models/Box.glb';

        // FIX: per-component options instead of generic { rainbow: true, radius: 0.4 }
        // particle-reveal default radius is 500 (px) — passing 0.4 made it invisible
        const COMPONENT_OPTIONS = {
            'particle-reveal':  { background: '#0a0e1a' },
            'decryptreveal':    { background: '#0a0e1a' },
            'shatter':          {},
            'peel':             {},
            'liquid':           { rainbow: true, radius: 0.3 },
            'bend':             {},
            'displacement':     {},
            'ripple':           {},
            'magnify':          {},
            'glitch':           {},
            'vhs':              {},
            'retrodither':      { background: '#0a0e1a' },
            'frost':            {},
            'blaze':            {},
            'flamewrap':        {},
            'clouds':           {},
            'droplets':         {},
            'forcefield':       {},
            'bubble':           {},
            'cloth':            {},
            'grid':             {},
            'hexfloat':         {},
            'glyphrain':        {},
            'particlescroll':   {},
            'glass':            {},
            'laser':            {},
            'canvas':           {},
            'asciify':          { background: [0.04, 0.05, 0.1], backgroundOpacity: 1 },
        };

        // State
        let source = document.getElementById('source-canvas');
        let output = document.getElementById('output-canvas');
        const content = document.getElementById('content');
        const stage = document.getElementById('stage');
        const infoName = document.getElementById('info-name');
        const infoDesc = document.getElementById('info-desc');
        const infoErr = document.getElementById('info-err');
        const stageHint = document.getElementById('stageHint');
        let current = null;
        let aiTimers = [];
        let currentIndex = -1;

        /* ----- Source canvas drawing (dark theme) ----- */
        function drawSource() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            // BUG FIX: use source.clientWidth (the canvas's own layout size), not stage.clientWidth
            const w = source.clientWidth || stage.clientWidth, h = source.clientHeight || stage.clientHeight;
            if (!w || !h) return;
            source.width = Math.round(w * dpr);
            source.height = Math.round(h * dpr);
            const ctx = source.getContext('2d');
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, w, h);
            // Dark background matching stage
            ctx.fillStyle = '#0a0e1a';
            ctx.fillRect(0, 0, w, h);
            // Light text
            ctx.fillStyle = '#f1f5f9';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = '800 ' + Math.round(Math.min(w * 0.07, 72)) + 'px -apple-system, sans-serif';
            ctx.fillText('MINDTRAINER', w / 2, h / 2 - 22);
            ctx.font = '500 ' + Math.round(Math.min(w * 0.024, 22)) + 'px -apple-system, sans-serif';
            ctx.fillStyle = 'rgba(241,245,249,.5)';
            ctx.fillText('选一个测试', w / 2, h / 2 + 30);
        }

        /* ----- FIX: fresh output canvas per component + force WebGL context loss ----- */
        function refreshOutputCanvas() {
            if (current && current.destroy) {
                try { current.destroy(); } catch (e) {}
                current = null;
            }
            // BUG FIX: Force WebGL context loss on old canvas to prevent context exhaustion
            // After switching through ~16 components, browsers refuse new WebGL contexts → black screen
            try {
                const oldGl = output.getContext('webgl2');
                if (oldGl) {
                    const ext = oldGl.getExtension('WEBGL_lose_context');
                    if (ext) ext.loseContext();
                }
            } catch (e) {}
            // Replace canvas element entirely — guarantees a clean WebGL context
            const fresh = document.createElement('canvas');
            fresh.id = 'output-canvas';
            fresh.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;';
            output.replaceWith(fresh);
            output = fresh;
        }

        /* ----- Auto interaction (pointermove → click → move) ----- */
        function autoInteract(inst, el) {
            if (!inst || !el) return;
            const rect = () => el.getBoundingClientRect();
            const fire = (type, x, y) => {
                try {
                    el.dispatchEvent(new PointerEvent(type, { clientX: x, clientY: y, bubbles: true, cancelable: true }));
                } catch (e) {}
            };
            const cx = () => rect().left + rect().width / 2;
            const cy = () => rect().top + rect().height / 2;
            aiTimers.push(setTimeout(() => fire('pointermove', cx(), cy()), 300));
            aiTimers.push(setTimeout(() => {
                try {
                    el.dispatchEvent(new MouseEvent('click', { clientX: cx(), clientY: cy(), bubbles: true, cancelable: true }));
                } catch (e) {}
            }, 650));
            aiTimers.push(setTimeout(() => fire('pointermove', cx() + Math.min(120, rect().width * 0.2), cy() - Math.min(60, rect().height * 0.15)), 1100));
        }

        /* ----- Load a component ----- */
        async function loadComponent(name, createName, displayName, desc) {
            infoErr.textContent = '';
            // Clear pending interaction timers
            aiTimers.forEach(t => clearTimeout(t));
            aiTimers = [];

            // Show hint
            stageHint.classList.add('show');
            setTimeout(() => stageHint.classList.remove('show'), 3000);

            // FIX: fresh canvas per component (with WebGL context loss)
            refreshOutputCanvas();

            // BUG FIX: wait one frame so the new canvas has proper layout dimensions
            // Without this, output.clientWidth may be 0 → component gets bad dimensions → black screen
            await new Promise(r => requestAnimationFrame(() => r()));

            try {
                const m = await import(`./assets/js/canvasui/${name}.js`);
                let createFn = m[createName];
                if (typeof createFn !== 'function') {
                    const alt = Object.keys(m).find(k => k.startsWith('create') && typeof m[k] === 'function');
                    if (!alt) throw new Error('无 create 函数');
                    createFn = m[alt];
                }

                if (OBJECT_COMPONENTS.has(name)) {
                    // BUG FIX: components expect config.src (not config.model) for model URL
                    current = createFn({ canvas: output }, { src: MODEL_URL, autoRotate: true, autoRotateSpeed: 1.5 });
                    infoErr.textContent = current ? '' : '（create 返回 null）';
                } else {
                    // BUG FIX: redraw source AFTER canvas replacement to ensure correct dimensions
                    drawSource();
                    // Pass content div (not stage), and per-component options
                    const opts = COMPONENT_OPTIONS[name] || {};
                    current = createFn({ source, content, output }, opts);
                    infoErr.textContent = current ? '' : '（create 返回 null — WebGL 可能不可用）';
                }

                if (current) {
                    autoInteract(current, output);
                }
            } catch (e) {
                infoErr.textContent = '错误: ' + (e.message || e);
                console.error('[Gallery] Component load error:', name, e);
            }
        }

        /* ----- Build sidebar ----- */
        function buildList() {
            const wrap = document.getElementById('galleryList');
            const grouped = {};
            COMPONENTS.forEach((c, i) => {
                const cat = c[4];
                if (!grouped[cat]) grouped[cat] = [];
                grouped[cat].push({ comp: c, index: i });
            });

            const catOrder = ['reveal', 'distort', 'atmosphere', 'grid', 'object3d', 'material'];
            let html = '';
            for (const cat of catOrder) {
                if (!grouped[cat]) continue;
                html += `<div class="sidebar-cat">${CATEGORY_LABELS[cat]}</div>`;
                for (const { comp, index } of grouped[cat]) {
                    const [file, fnName, dispName, desc] = comp;
                    html += `<button class="comp-btn" data-index="${index}" data-name="${dispName.toLowerCase()}">
                        <span>${dispName}</span>
                        <small>${desc.split('：')[0]}</small>
                    </button>`;
                }
            }
            wrap.innerHTML = html;

            // Click handlers
            wrap.querySelectorAll('.comp-btn').forEach(btn => {
                btn.addEventListener('click', () => selectComponent(parseInt(btn.dataset.index)));
            });
        }

        /* ----- Select a component by index ----- */
        function selectComponent(index) {
            if (index < 0 || index >= COMPONENTS.length) return;
            currentIndex = index;
            const [file, fnName, dispName, desc] = COMPONENTS[index];

            // Update active state
            document.querySelectorAll('.comp-btn').forEach(b => b.classList.remove('active'));
            const btn = document.querySelector(`.comp-btn[data-index="${index}"]`);
            if (btn) {
                btn.classList.add('active');
                btn.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }

            infoName.textContent = dispName;
            infoDesc.textContent = desc;
            loadComponent(file, `create${fnName}`, dispName, desc);
        }

        /* ----- Search ----- */
        document.getElementById('gallerySearch').addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase().trim();
            document.querySelectorAll('.comp-btn').forEach(btn => {
                const match = !q || btn.dataset.name.includes(q);
                btn.style.display = match ? '' : 'none';
            });
            // Hide empty category headers
            document.querySelectorAll('.sidebar-cat').forEach(cat => {
                let next = cat.nextElementSibling;
                let hasVisible = false;
                while (next && !next.classList.contains('sidebar-cat')) {
                    if (next.style.display !== 'none') { hasVisible = true; break; }
                    next = next.nextElementSibling;
                }
                cat.style.display = hasVisible ? '' : 'none';
            });
        });

        /* ----- Random button ----- */
        document.getElementById('randomBtn').addEventListener('click', () => {
            let idx;
            do { idx = Math.floor(Math.random() * COMPONENTS.length); }
            while (idx === currentIndex && COMPONENTS.length > 1);
            selectComponent(idx);
        });

        /* ----- Keyboard navigation ----- */
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
                e.preventDefault();
                selectComponent(Math.min(currentIndex + 1, COMPONENTS.length - 1));
            } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
                e.preventDefault();
                selectComponent(Math.max(currentIndex - 1, 0));
            } else if (e.key === 'r' || e.key === 'R') {
                document.getElementById('randomBtn').click();
            }
        });

        /* ----- Resize ----- */
        window.addEventListener('resize', () => {
            if (!OBJECT_COMPONENTS.has(COMPONENTS[currentIndex]?.[0])) {
                drawSource();
            }
            if (current && current.resize) {
                try { current.resize(); } catch (e) {}
            }
        });

        /* ----- Init ----- */
        buildList();
        selectComponent(0);
    </script>
</body>
</html>
