<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>特效画廊 — MindTrainer</title>
    <meta name="description" content="33 个 WebGL 视觉组件画廊,全部可交互演示,每个组件独立可复制。">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/icons/favicon-16x16.png">
    <link rel="stylesheet" href="/assets/css/mt.css?v=20260915">
    <style>
        :root {
            --dark-bg: #080b16;
            --dark-surface: #0f1424;
            --dark-ink: #f1f5f9;
            --dark-ink-2: #94a3b8;
            --dark-ink-3: #475569;
            --dark-line: rgba(255, 255, 255, .07);
            --r-pill: 999px;
            --r-sm: 10px;
            --r-card: 14px;
        }
        *, *::before, *::after { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; overflow: hidden; }
        body {
            background: var(--dark-bg);
            color: var(--dark-ink);
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .gallery-bg {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background:
                radial-gradient(900px 600px at 15% 15%, rgba(59,130,246,.12), transparent 55%),
                radial-gradient(700px 500px at 90% 85%, rgba(139,92,246,.08), transparent 55%);
        }
        .gallery-bg::after {
            content: ""; position: absolute; inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
            background-size: 48px 48px;
            -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, #000 20%, transparent 85%);
            mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, #000 20%, transparent 85%);
        }
        .gallery-topbar {
            position: relative; z-index: 10;
            display: flex; align-items: center; gap: 16px;
            padding: 0 24px; height: 56px;
            background: rgba(15,20,36,.7);
            -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,.07);
        }
        .gallery-back {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 14px; font-weight: 600; color: var(--dark-ink-2);
            text-decoration: none; transition: color .2s ease;
        }
        .gallery-back:hover { color: #fff; }
        .gallery-back svg { width: 16px; height: 16px; }
        .gallery-title {
            font-size: 16px; font-weight: 800; letter-spacing: -.02em; color: #fff;
        }
        #count {
            margin-left: auto;
            font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
            color: var(--dark-ink-3);
            background: rgba(255,255,255,.05);
            padding: 5px 12px; border-radius: var(--r-pill);
            border: 1px solid rgba(255,255,255,.08);
        }
        .gallery-btn {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 13px; font-weight: 600; cursor: pointer;
            background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.12);
            color: var(--dark-ink);
            padding: 6px 14px; border-radius: var(--r-pill);
            transition: background .2s ease, border-color .2s ease;
        }
        .gallery-btn:hover { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.2); }
        .gallery-btn svg { width: 14px; height: 14px; }
        .gallery-body {
            position: relative; z-index: 1;
            display: flex;
            height: calc(100vh - 56px);
            height: calc(100dvh - 56px);
        }
        .gallery-sidebar {
            width: 260px; flex: none;
            background: rgba(15,20,36,.5);
            -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
            border-right: 1px solid rgba(255,255,255,.07);
            display: flex; flex-direction: column;
            overflow: hidden;
        }
        .sidebar-search {
            padding: 14px 14px 10px;
            position: relative;
        }
        .sidebar-search input {
            width: 100%; box-sizing: border-box;
            background: rgba(255,255,255,.05);
            border: 1px solid rgba(255,255,255,.1);
            border-radius: var(--r-sm);
            color: var(--dark-ink);
            font: inherit; font-size: 13px;
            padding: 9px 12px 9px 34px;
            outline: none;
            transition: border-color .2s ease, background .2s ease;
        }
        .sidebar-search input::placeholder { color: var(--dark-ink-3); }
        .sidebar-search input:focus {
            border-color: rgba(59,130,246,.4);
            background: rgba(255,255,255,.07);
        }
        .sidebar-search svg {
            position: absolute; left: 26px; top: 50%; transform: translateY(-50%);
            width: 15px; height: 15px; color: var(--dark-ink-3);
            pointer-events: none;
        }
        .sidebar-nav { flex: 1; overflow-y: auto; padding: 4px 10px 16px; }
        .sidebar-nav::-webkit-scrollbar { width: 5px; }
        .sidebar-nav::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 3px; }
        .sidebar-cat {
            font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
            color: var(--dark-ink-3);
            padding: 16px 10px 6px;
            position: sticky; top: 0;
            background: rgba(15,20,36,.8);
            -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
            z-index: 1;
        }
        .comp-btn {
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
            width: 100%; text-align: left;
            background: none; border: none;
            color: rgba(255,255,255,.6);
            padding: 8px 12px; border-radius: var(--r-sm);
            cursor: pointer; font: inherit; font-size: 13px;
            transition: background .15s ease, color .15s ease;
        }
        .comp-btn:hover { background: rgba(255,255,255,.05); color: #fff; }
        .comp-btn.active {
            background: linear-gradient(135deg, rgba(59,130,246,.2), rgba(139,92,246,.12));
            color: #fff;
            border: 1px solid rgba(59,130,246,.2);
            padding: 7px 11px;
        }
        .comp-btn small {
            font-size: 10.5px; color: rgba(255,255,255,.3);
            flex-shrink: 0;
        }
        .comp-btn.active small { color: rgba(255,255,255,.45); }
        .gallery-stage {
            flex: 1; display: flex; flex-direction: column;
            min-width: 0; padding: 16px;
        }
        .stage-canvas-wrap {
            position: relative; flex: 1;
            border-radius: var(--r-card);
            overflow: hidden;
            background: #0a0e1a;
            border: 1px solid rgba(255,255,255,.08);
            box-shadow: 0 30px 80px -30px rgba(0,0,0,.5);
        }
        #stageFrame {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            border: 0; background: #0a0e1a;
            /* sandbox 在 HTML 属性里设 */
        }
        .stage-hint {
            position: absolute; top: 14px; left: 14px;
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 11px; font-weight: 600; letter-spacing: .06em;
            color: rgba(255,255,255,.4);
            background: rgba(0,0,0,.3);
            -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
            padding: 5px 12px; border-radius: var(--r-pill);
            border: 1px solid rgba(255,255,255,.06);
            z-index: 5; pointer-events: none;
            opacity: 0; transition: opacity .3s ease;
        }
        .stage-hint.show { opacity: 1; }
        .stage-info {
            display: flex; align-items: center; gap: 14px;
            padding: 14px 4px 0;
        }
        .info-left { display: flex; align-items: baseline; gap: 12px; flex: 1; min-width: 0; }
        .info-left h3 {
            font-size: 16px; font-weight: 700; color: #fff;
            margin: 0; white-space: nowrap;
        }
        .info-left p {
            font-size: 13px; color: var(--dark-ink-2);
            margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .info-err { color: #f87171; font-size: 12.5px; flex-shrink: 0; }
        @media (max-width: 768px) {
            .gallery-sidebar { width: 200px; }
            .gallery-stage { padding: 10px; }
            .gallery-topbar { padding: 0 14px; }
            #count { display: none; }
        }
        @media (max-width: 580px) {
            .gallery-body { flex-direction: column; }
            .gallery-sidebar {
                width: 100%; height: 180px;
                border-right: none;
                border-bottom: 1px solid rgba(255,255,255,.07);
            }
            .sidebar-nav { display: flex; gap: 6px; padding: 10px; overflow-x: auto; overflow-y: hidden; }
            .sidebar-cat { display: none; }
            .comp-btn { width: auto; flex-shrink: 0; }
        }
        @media (prefers-reduced-motion: reduce) {
            * { transition-duration: .01ms !important; }
        }
        .selftest {
            position: fixed; inset: 0; z-index: 100;
            display: none;
            background: rgba(4, 6, 14, .82);
            -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
            align-items: center; justify-content: center;
            padding: 24px;
        }
        .selftest.show { display: flex; }
        .selftest-panel {
            width: min(760px, 100%); max-height: 84vh;
            display: flex; flex-direction: column;
            background: var(--dark-surface);
            border: 1px solid rgba(255,255,255,.1);
            border-radius: var(--r-card);
            overflow: hidden;
        }
        .selftest-head {
            display: flex; align-items: center; gap: 12px;
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255,255,255,.08);
        }
        .selftest-head h2 { font-size: 15px; font-weight: 700; margin: 0; flex: 1; }
        .selftest-sum { font-size: 12.5px; color: var(--dark-ink-2); font-variant-numeric: tabular-nums; }
        .selftest-close {
            width: 30px; height: 30px; border-radius: var(--r-pill);
            border: 1px solid rgba(255,255,255,.12);
            background: transparent; color: var(--dark-ink-2); cursor: pointer;
            display: grid; place-items: center;
        }
        .selftest-close:hover { background: rgba(255,255,255,.08); color: #fff; }
        .selftest-body { overflow-y: auto; padding: 8px 0; }
        .st-row {
            display: grid; grid-template-columns: 18px 150px 1fr;
            gap: 10px; align-items: baseline;
            padding: 7px 20px; font-size: 12.5px;
        }
        .st-row + .st-row { border-top: 1px solid rgba(255,255,255,.04); }
        .st-ok   { color: #4ade80; }
        .st-bad  { color: #f87171; }
        .st-name { color: #fff; font-weight: 600; }
        .st-msg  { color: var(--dark-ink-2); word-break: break-word; }
    </style>
</head>
<body>
    <div class="gallery-bg"></div>

    <header class="gallery-topbar">
        <a class="gallery-back" href="/">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            返回首页
        </a>
        <span class="gallery-title">特效画廊</span>
        <button class="gallery-btn" id="selftestBtn" title="依次加载全部组件并报告失败项">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            自检
        </button>
        <button class="gallery-btn" id="randomBtn" title="随机组件">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
            随机
        </button>
        <span id="count">…</span>
    </header>

    <div class="gallery-body">
        <aside class="gallery-sidebar">
            <div class="sidebar-search">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                <input type="text" id="gallerySearch" placeholder="搜索组件…" autocomplete="off">
            </div>
            <nav class="sidebar-nav" id="galleryList"></nav>
        </aside>

        <main class="gallery-stage">
            <div class="stage-canvas-wrap">
                <span class="stage-hint" id="stageHint">移动鼠标 / 点击交互</span>
                <!-- allow-scripts + allow-same-origin 这对组合确实会削弱沙箱的
                     隔离意义，但这里是同源静态资源：去掉 allow-same-origin 会让
                     iframe 变成 opaque origin，postMessage 的 origin 校验和
                     contentWindow 访问都会失效。保留它，其余能力（表单、弹窗、
                     顶层导航）仍被沙箱限制。 -->
                <iframe id="stageFrame"
                        sandbox="allow-scripts allow-same-origin"
                        title="WebGL 场景"
                        referrerpolicy="no-referrer"></iframe>
            </div>
            <div class="stage-info">
                <div class="info-left">
                    <h3 id="info-name"></h3>
                    <p id="info-desc"></p>
                    <span class="info-err" id="info-err"></span>
                </div>
            </div>
        </main>
    </div>

    <div class="selftest" id="selftest">
        <div class="selftest-panel">
            <div class="selftest-head">
                <h2>组件自检</h2>
                <span class="selftest-sum" id="stSum">准备中…</span>
                <button class="selftest-close" id="stClose" aria-label="关闭">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="selftest-body" id="stBody"></div>
        </div>
    </div>

    <script type="module" src="/assets/js/canvasui-gallery.js?v=20260915"></script>
    <script src="/assets/js/feedback-marker.js?v=20260915" defer></script>
</body>
</html>
