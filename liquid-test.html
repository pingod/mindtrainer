<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas UI 测试 — Liquid</title>
    <style>
        body { margin: 0; background: #0a0a0a; color: #fff; font-family: -apple-system, sans-serif; overflow: hidden; }
        .liq-wrap { position: relative; width: 100vw; height: 100vh; }
        #source-canvas { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; pointer-events: none; }
        #content { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
                   font-size: clamp(40px, 8vw, 96px); font-weight: 800; letter-spacing: .05em;
                   color: #fff; text-align: center; line-height: 1.1; }
        #output-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
        .liq-hint { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
                    color: rgba(255,255,255,.5); font-size: 13px; letter-spacing: .1em; z-index: 5; }
        .liq-badge { position: fixed; top: 18px; left: 18px; color: rgba(255,255,255,.45);
                     font-size: 12px; letter-spacing: .15em; text-transform: uppercase; z-index: 5; }
    </style>
</head>
<body>
    <div class="liq-wrap">
        <canvas id="source-canvas"></canvas>
        <div id="content">MINDTRAINER<br>选一个测试</div>
        <canvas id="output-canvas"></canvas>
    </div>
    <div class="liq-badge">Canvas UI · Liquid</div>
    <div class="liq-hint">移动鼠标 / 触摸 · 液体流动扭曲内容</div>

    <script type="module">
        import { createLiquid } from './assets/js/canvasui/liquid.js';

        const source = document.getElementById('source-canvas');
        const output = document.getElementById('output-canvas');
        const content = document.getElementById('content');

        const ctx = source.getContext('2d');
        function drawSource() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            const w = source.clientWidth, h = source.clientHeight;
            if (!w || !h) return;
            source.width = Math.round(w * dpr);
            source.height = Math.round(h * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, w, h);
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, w, h);
            ctx.fillStyle = '#fff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = '800 ' + Math.round(Math.min(w * 0.09, 96)) + 'px -apple-system, sans-serif';
            ctx.fillText('MINDTRAINER', w / 2, h / 2 - 34);
            ctx.font = '500 ' + Math.round(Math.min(w * 0.03, 28)) + 'px -apple-system, sans-serif';
            ctx.fillStyle = 'rgba(255,255,255,.85)';
            ctx.fillText('选一个测试', w / 2, h / 2 + 40);
        }
        window.addEventListener('resize', () => { drawSource(); if (window.__liq) window.__liq.resize(); });
        drawSource();

        try {
            const inst = createLiquid(
                { source, content, output },
                { simResolution: 128, dyeResolution: 512, densityDissipation: 0.96, velocityDissipation: 1,
                  pressure: 0.8, curl: 1.9, radius: 0.3, force: 1.2, intensity: 2,
                  distortion: 0.5, blend: 5, rainbow: true }
            );
            window.__liq = inst;
            window.__liqErr = null;
        } catch (e) {
            window.__liqErr = String((e && e.message) || e);
            window.__liq = null;
        }
        document.querySelector('.liq-hint').textContent = window.__liq ? '移动鼠标 / 触摸 · 液体流动扭曲内容' : '初始化失败：' + (window.__liqErr || '返回 null');
    </script>
    <script src="assets/js/feedback-marker.js?v=20260849" defer></script>
</body>
</html>
