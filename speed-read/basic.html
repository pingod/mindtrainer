<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基础训练 – 飞克视读训练中心</title>
    <meta name="description" content="基础训练 26 项：视野扩展与眼球运动训练，保持视线垂直、深呼吸、不眨眼。">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/images/icons/favicon-16x16.png">
    <link rel="stylesheet" href="../assets/css/global.min.css?v=20260811">

    <script src="/assets/js/mt-nav.js?v=20260811" defer></script>
</head>
<body>
<header id="mt-header"></header>

<main>
    <section class="sr-hero" id="sr-hero">
        <h1>基础训练</h1>
        <p>视野扩展与眼球运动训练：保持端正姿势、深呼吸、尽量不眨眼。</p>
    </section>

    <div class="sr-layout">
        <aside class="sr-list-panel">
            <h2>训练项目</h2>
            <div class="sr-train-list" id="trainList"></div>
        </aside>

        <div class="sr-stage-wrap">
            <div class="sr-stage" id="stage">
                <canvas id="canvas"></canvas>
                <div class="sr-inline-status">
                    <span id="statusName"></span>
                    <span id="statusInfo"></span>
                </div>
                <div class="sr-stage-hint">空格 开始/暂停 · ↑↓ 调速 · 右键 暂停 · Esc 退出全屏</div>
            </div>
            <div class="sr-control-bar" id="controls"></div>
            <div class="sr-method" id="methodBox"></div>
        </div>

        <aside class="sr-param-panel">
            <h2>参数设置</h2>
            <div id="paramPanel"></div>
        </aside>
    </div>
</main>

<footer>
    <div class="footer-center-box">
        <div class="footer-center-content-box">
            <p>
                <span class="footer-brand-line">&copy;&nbsp;<span id="currentYear"></span>&nbsp;MindTrainer · 飞克视读 Web 重写版</span>
                <span class="footer-link-line">
                    <a href="../about/">关于</a>
                    <a href="index.html">速读训练</a>
                </span>
            </p>
        </div>
    </div>
</footer>

<script src="../assets/js/global.min.js?v=20260811" defer></script>
<script src="js/sr-common.js?v=20260811" defer></script>
<script src="js/sr-basic.js?v=20260811" defer></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const y = document.getElementById('currentYear');
    if (y) y.textContent = new Date().getFullYear();
});
</script>
