<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>照相记忆 – 飞克视读训练中心</title>
    <meta name="description" content="照相记忆 8 项：三色卡、几何卡、黄卡、曼陀罗、3D 卡、图片浏览、记忆训练、瞬间计算。">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/images/icons/favicon-16x16.png">
    <link rel="stylesheet" href="../assets/css/global.min.css">
    <link rel="stylesheet" href="../assets/css/style.min.css">
    <link rel="stylesheet" href="css/speed-read.css">
</head>
<body>
<header>
    <div class="header-left-box">
        <div class="header-left-content-box">
            <a href="../">
                <div class="header-mark-box">MindTrainer</div>
            </a>
        </div>
    </div>
    <div class="header-center-box">
        <img alt="MindTrainer logo" src="../assets/images/logo.png" width="192" height="192" decoding="async">
    </div>
    <div class="header-right-box">
        <div class="header-right-content-box">
            <nav class="nav-links" aria-label="Main navigation">
                <a href="../">认知测试</a>
                <a href="index.html">飞克视读</a>
                <a href="basic.html">基础训练</a>
                <a href="flash.html">闪视</a>
                <a href="speed.html">速读</a>
                <a href="photo.html" aria-current="page">照相记忆</a>
            </nav>
        </div>
    </div>
</header>

<main>
    <section class="sr-hero" id="sr-hero">
        <h1>照相记忆</h1>
        <p>残像训练、曼陀罗、3D 卡、瞬间计算——右脑开发与记忆素质检测。</p>
    </section>

    <div class="sr-layout">
        <aside class="sr-list-panel">
            <h2>训练项目</h2>
            <div class="sr-train-list" id="trainList"></div>
        </aside>

        <div class="sr-stage-wrap">
            <div class="sr-stage" id="stage">
                <canvas id="canvas"></canvas>
                <div class="sr-inline-status">
                    <span id="statusName"></span>
                    <span id="statusInfo"></span>
                </div>
                <div class="sr-stage-hint">空格 开始/暂停 · 记忆训练点击翻牌 · 曼陀罗点击切换填充 · Esc 退出全屏</div>
            </div>
            <div class="sr-control-bar" id="controls"></div>
            <div class="sr-method" id="methodBox"></div>
        </div>

        <aside class="sr-param-panel">
            <h2>参数设置</h2>
            <div id="paramPanel"></div>
        </aside>
    </div>
</main>

<footer>
    <div class="footer-center-box">
        <div class="footer-center-content-box">
            <p>
                <span class="footer-brand-line">&copy;&nbsp;<span id="currentYear"></span>&nbsp;MindTrainer · 飞克视读 Web 重写版</span>
                <span class="footer-link-line">
                    <a href="../about/">关于</a>
                    <a href="index.html">速读训练</a>
                </span>
            </p>
        </div>
    </div>
</footer>

<script src="../assets/js/global.min.js" defer></script>
<script src="js/sr-common.js" defer></script>
<script src="js/sr-photo.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const y = document.getElementById('currentYear');
    if (y) y.textContent = new Date().getFullYear();
});
</script>
</body>
</html>
