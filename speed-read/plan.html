<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>训练计划 – 飞克视读训练中心</title>
    <meta name="description" content="自定义训练计划：添加训练步骤与时长，一键按序执行整套训练教程。">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/images/icons/favicon-16x16.png">
    <link rel="stylesheet" href="../assets/css/global.min.css?v=20260830">
    <link rel="stylesheet" href="../assets/css/style.min.css?v=20260830">
    <link rel="stylesheet" href="css/speed-read.css?v=20260830">
    <style>
        .sr-plan-wrap { flex: 0 0 100%; max-width: 960px; box-sizing: border-box; margin: 0 auto; padding: 20px 20px 60px; display: grid; gap: 18px; }
        .sr-plan-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 20px; }
        .sr-plan-card h2 { font-size: 15px; margin: 0 0 12px; color: #0f172a; }
        .sr-plan-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
        .sr-plan-row input[type="text"], .sr-plan-row input[type="number"], .sr-plan-row select {
            padding: 8px 10px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px;
        }
        .sr-plan-row input[type="text"] { flex: 1; min-width: 160px; }
        .sr-plan-step { display: flex; align-items: center; gap: 12px; padding: 10px; border: 1px solid #f1f5f9; border-radius: 10px; margin-bottom: 6px; background: #fafbfc; }
        .sr-plan-step-idx { font-size: 13px; color: #94a3b8; min-width: 26px; }
        .sr-plan-step-info { flex: 1; }
        .sr-plan-step-name { font-size: 14px; font-weight: 600; color: #0f172a; }
        .sr-plan-step-desc { font-size: 12px; color: #94a3b8; }
        .sr-plan-step-ops { display: flex; gap: 6px; }
        .sr-btn-mini { padding: 4px 9px; font-size: 12px; border-radius: 7px; }
        .sr-plan-total { font-size: 13px; color: #64748b; margin-top: 10px; }
        #execPanel { display: none; }
        .exec-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
        .exec-progress-wrap { flex: 1; height: 8px; background: #e2e8f0; border-radius: 999px; overflow: hidden; min-width: 120px; }
        #execProgress { height: 100%; background: linear-gradient(90deg, #6366f1, #22c55e); width: 0; transition: width .3s; }
        #execCountdown { font-variant-numeric: tabular-nums; font-size: 14px; color: #0f172a; font-weight: 700; }
        #execStepName { font-size: 15px; font-weight: 600; color: #0f172a; }
        #execFrame { width: 100%; height: 62vh; border: 1px solid #e2e8f0; border-radius: 12px; background: #0b0f14; }
    </style>
    <script src="/assets/js/mt-nav.js?v=20260830" defer></script>
</head>
<body>
<header id="mt-header"></header>

<main>
    <section class="sr-hero" id="sr-hero">
        <h1>训练计划</h1>
        <p>自定义训练步骤与时长，一键按序执行整套训练教程。</p>
    </section>

    <div class="sr-plan-wrap">
        <div class="sr-plan-card">
            <h2>计划管理</h2>
            <div class="sr-plan-row">
                <input type="text" id="planName" placeholder="计划名称" value="我的训练计划">
                <select id="planSel"></select>
                <button type="button" class="sr-btn" id="savePlanBtn">💾 保存</button>
                <button type="button" class="sr-btn" id="deletePlanBtn">🗑 删除</button>
                <button type="button" class="sr-btn" id="exportPlanBtn">⬇ 导出</button>
                <button type="button" class="sr-btn" id="importPlanBtn">⬆ 导入</button>
                <input type="file" id="importFile" accept="application/json" style="display:none">
            </div>
        </div>

        <div class="sr-plan-card">
            <h2>添加步骤</h2>
            <div class="sr-plan-row">
                <select id="moduleSel"></select>
                <select id="trainSel"></select>
                <input type="number" id="stepMinutes" value="3" min="1" max="120" style="width:80px">
                <span style="font-size:13px;color:#64748b">分钟</span>
                <button type="button" class="sr-btn sr-btn-start" id="addStepBtn">＋ 添加</button>
            </div>
            <div id="stepList"></div>
            <p class="sr-plan-total" id="planTotal"></p>
        </div>

        <div class="sr-plan-card" id="execPanel">
            <div class="exec-bar">
                <button type="button" class="sr-btn sr-btn-start" id="execStartBtn">▶ 开始执行</button>
                <button type="button" class="sr-btn" id="execPauseBtn" style="display:none">暂停</button>
                <button type="button" class="sr-btn" id="execStopBtn" style="display:none">停止</button>
                <span id="execStepName"></span>
                <span id="execCountdown"></span>
                <div class="exec-progress-wrap"><div id="execProgress"></div></div>
            </div>
            <iframe id="execFrame" src="about:blank" title="训练执行窗口"></iframe>
        </div>

        <div class="sr-plan-card">
            <button type="button" class="sr-btn sr-btn-start" id="execPlanBtn">▶ 开始执行当前计划</button>
            <p class="sr-plan-total">执行时将在下方按顺序打开每个训练，自动倒计时切换。暂停/继续/停止随时可控。</p>
        </div>
    </div>
</main>

<footer>
    <div class="footer-center-box">
        <div class="footer-center-content-box">
            <p>
                <span class="footer-brand-line">&copy;&nbsp;<span id="currentYear"></span>&nbsp;MindTrainer · 飞克视读 Web 重写版</span>
                <span class="footer-link-line">
                    <a href="../about/">关于</a>
                    <a href="index.html">速读训练</a>
                </span>
            </p>
        </div>
    </div>
</footer>

<script src="../assets/js/global.min.js?v=20260830" defer></script>
<script src="js/sr-common.js?v=20260830" defer></script>
<script src="js/sr-plan.js?v=20260830" defer></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const y = document.getElementById('currentYear');
    if (y) y.textContent = new Date().getFullYear();
});
</script>
    <script src="../assets/js/feedback-marker.js?v=20260849" defer></script>
</body>
</html>
