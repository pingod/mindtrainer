<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>训练计划 – 飞克视读训练中心</title>
    <meta name="description" content="自定义训练计划：添加训练步骤与时长，一键按序执行整套训练教程。">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/images/icons/favicon-16x16.png">
    <script>try{var t=localStorage.getItem('mt-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
    <link rel="stylesheet" href="/assets/css/mt.css?v=20270101">
    <link rel="stylesheet" href="css/speed-read.css?v=20270101">
    <style>
        /* plan builder, on the shared token system */
        .sr-plan-wrap { width: 100%; max-width: 960px; margin-inline: auto; padding: 8px 20px clamp(48px, 7vw, 80px); display: grid; gap: 16px; }
        .sr-plan-card { padding: 20px; border-radius: var(--r-card); background: var(--surface); border: 1px solid var(--line); }
        .sr-plan-card h2 { margin-bottom: 12px; font-size: 15px; color: var(--ink); }
        .sr-plan-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
        .sr-plan-row input[type="text"],
        .sr-plan-row input[type="number"],
        .sr-plan-row select {
            padding: 8px 10px; font-size: 14px;
            border: 1px solid var(--line-2); border-radius: var(--r-input);
            background: var(--surface); color: var(--ink);
        }
        .sr-plan-row input:focus-visible,
        .sr-plan-row select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
        .sr-plan-row input[type="text"] { flex: 1; min-width: 160px; }
        .sr-plan-step {
            display: flex; align-items: center; gap: 12px;
            margin-bottom: 6px; padding: 11px;
            border: 1px solid var(--line); border-radius: var(--r-input);
            background: var(--surface-2);
        }
        .sr-plan-step-idx { min-width: 26px; font-size: 13px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
        .sr-plan-step-info { flex: 1; min-width: 0; }
        .sr-plan-step-name { font-size: 14px; font-weight: 600; color: var(--ink); }
        .sr-plan-step-desc { font-size: 12px; color: var(--ink-3); }
        .sr-plan-step-ops { display: flex; gap: 6px; }
        .sr-btn-mini { height: 30px; padding-inline: 11px; font-size: 12px; }
        .sr-plan-total { margin-top: 10px; font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }

        #execPanel { display: none; }
        .exec-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
        .exec-progress-wrap { flex: 1; min-width: 120px; height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
        #execProgress { width: 0; height: 100%; background: var(--accent); transition: width .3s var(--ease); }
        #execCountdown { font-size: 14px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
        #execStepName { font-size: 15px; font-weight: 600; color: var(--ink); }
        #execFrame { width: 100%; height: 62vh; border: 1px solid var(--line); border-radius: var(--r-stage); background: var(--sr-stage); }
    </style>
    <script src="/assets/js/mt-nav.js?v=20270101" defer></script>
</head>
<body>
<header id="mt-header"></header>

<main>
    <section class="sr-hero" id="sr-hero">
        <h1>训练计划</h1>
        <p>自定义训练步骤与时长，一键按序执行整套训练教程。</p>
    </section>

    <div class="sr-plan-wrap">
        <div class="sr-plan-card">
            <h2>计划管理</h2>
            <div class="sr-plan-row">
                <input type="text" id="planName" placeholder="计划名称" value="我的训练计划">
                <select id="planSel"></select>
                <button type="button" class="sr-btn" id="savePlanBtn">💾 保存</button>
                <button type="button" class="sr-btn" id="deletePlanBtn">🗑 删除</button>
                <button type="button" class="sr-btn" id="exportPlanBtn">⬇ 导出</button>
                <button type="button" class="sr-btn" id="importPlanBtn">⬆ 导入</button>
                <input type="file" id="importFile" accept="application/json" style="display:none">
            </div>
        </div>

        <div class="sr-plan-card">
            <h2>添加步骤</h2>
            <div class="sr-plan-row">
                <select id="moduleSel"></select>
                <select id="trainSel"></select>
                <input type="number" id="stepMinutes" value="3" min="1" max="120" style="width:80px">
                <span style="font-size:13px;color:#64748b">分钟</span>
                <button type="button" class="sr-btn sr-btn-start" id="addStepBtn">＋ 添加</button>
            </div>
            <div id="stepList"></div>
            <p class="sr-plan-total" id="planTotal"></p>
        </div>

        <div class="sr-plan-card" id="execPanel">
            <div class="exec-bar">
                <button type="button" class="sr-btn sr-btn-start" id="execStartBtn">▶ 开始执行</button>
                <button type="button" class="sr-btn" id="execPauseBtn" style="display:none">暂停</button>
                <button type="button" class="sr-btn" id="execStopBtn" style="display:none">停止</button>
                <span id="execStepName"></span>
                <span id="execCountdown"></span>
                <div class="exec-progress-wrap"><div id="execProgress"></div></div>
            </div>
            <iframe id="execFrame" src="about:blank" title="训练执行窗口"></iframe>
        </div>

        <div class="sr-plan-card">
            <button type="button" class="sr-btn sr-btn-start" id="execPlanBtn">▶ 开始执行当前计划</button>
            <p class="sr-plan-total">执行时将在下方按顺序打开每个训练，自动倒计时切换。暂停/继续/停止随时可控。</p>
        </div>
    </div>
</main>

<footer></footer>

<script src="js/sr-common.js?v=20270101" defer></script>
<script src="js/sr-plan.js?v=20270101" defer></script>
<script src="/assets/js/feedback-marker.js?v=20270101" defer></script>
</body>
</html>
