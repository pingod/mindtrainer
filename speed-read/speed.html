<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>速读训练 – 飞克视读训练中心</title>
    <meta name="description" content="速读训练 4 大模块：字块移动、视野扩展、阅读训练、实战训练（模拟书刊排版）。">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/images/icons/favicon-16x16.png">
    <script>try{var t=localStorage.getItem('mt-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
    <link rel="stylesheet" href="/assets/css/mt.css?v=20270101">
    <link rel="stylesheet" href="css/speed-read.css?v=20270101">
    <style>
        /* article picker, on the same tokens as the rest of the param panel */
        .sr-article-select,
        .sr-article-text {
            width: 100%;
            box-sizing: border-box;
            padding: 7px 9px;
            border: 1px solid var(--line-2);
            border-radius: var(--r-input);
            background: var(--surface);
            color: var(--ink);
            font-size: 13px;
        }
        .sr-article-select { margin-bottom: 8px; }
        .sr-article-text { padding: 9px; resize: vertical; font-family: inherit; line-height: 1.6; }
        .sr-article-select:focus-visible,
        .sr-article-text:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
        .sr-article-clip { width: 100%; margin-top: 8px; }
    </style>
    <script src="/assets/js/mt-nav.js?v=20270101" defer></script>
</head>
<body>
<header id="mt-header"></header>

<main>
    <section class="sr-hero" id="sr-hero">
        <h1>速读训练</h1>
        <p>字块移动、视野扩展、阅读训练、实战训练——让眼睛更有效率，让理解更迅速。</p>
    </section>

    <div class="sr-layout">
        <aside class="sr-list-panel">
            <h2>训练模块</h2>
            <div class="sr-train-list" id="trainList"></div>
            <div class="sr-method" style="margin-top:12px" id="articlePanel"></div>
        </aside>

        <div class="sr-stage-wrap">
            <div class="sr-stage" id="stage">
                <canvas id="canvas"></canvas>
                <div class="sr-inline-status">
                    <span id="statusName"></span>
                    <span id="statusInfo"></span>
                </div>
                <div class="sr-stage-hint">空格 开始/暂停 · ↑↓ 调速 · 文章可自选/粘贴/读取剪贴板 · Esc 退出全屏</div>
            </div>
            <div class="sr-control-bar" id="controls"></div>
            <div class="sr-method" id="methodBox"></div>
        </div>

        <aside class="sr-param-panel">
            <h2>参数设置</h2>
            <div id="paramPanel"></div>
        </aside>
    </div>
</main>

<footer></footer>

<script src="js/sr-common.js?v=20270101" defer></script>
<script src="js/sr-speed.js?v=20270101" defer></script>
<script src="/assets/js/feedback-marker.js?v=20270101" defer></script>
</body>
</html>
